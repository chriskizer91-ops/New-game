<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aethermoor — Character Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg0: #0c0a0e; --bg1: #110f15; --bg2: #16131c;
    --panel: #1a1722; --panel2: #14111b; --panel-hover: #201c2a;
    --text: #ede8df; --text-dim: #c4bdb0; --text-muted: #7d7688;
    --accent: #c9a24d; --accent-dim: rgba(201,162,77,.12); --accent-glow: rgba(201,162,77,.2);
    --accent2: #7ea88e; --accent2-dim: rgba(126,168,142,.12);
    --warn: #d4a24a; --warn-dim: rgba(212,162,74,.12);
    --danger: #c47272; --danger-dim: rgba(196,114,114,.12);
    --info: #8a9ec4; --info-dim: rgba(138,158,196,.12);
    --hp-green: #7ea88e; --hp-yellow: #c9a24d; --hp-red: #c47272;
    --border: rgba(237,232,223,.06); --border-accent: rgba(201,162,77,.25); --border-hover: rgba(237,232,223,.12);
    --shadow: 0 4px 24px rgba(0,0,0,.5); --shadow-lg: 0 12px 48px rgba(0,0,0,.6);
    --radius: 6px; --radius-sm: 4px; --radius-pill: 999px;
    --serif: 'Cormorant Garamond', 'Georgia', serif;
    --font: 'DM Sans', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --base: 14px; --transition: .2s cubic-bezier(.4,0,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font); font-size: var(--base); line-height: 1.55;
    color: var(--text); background: var(--bg0); overflow-x: hidden; min-height: 100vh;
  }

  /* Texture overlay — grain, not glow */
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 700px 500px at 20% 5%, rgba(201,162,77,.04) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 80% 90%, rgba(126,168,142,.03) 0%, transparent 70%);
    z-index: -1; pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.35; z-index: -1; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 200px 200px;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,162,77,.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(201,162,77,.3); }

  .app-wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ============================================================
     HEADER — responds to the character arriving
     ============================================================ */
  .header { text-align: center; margin-bottom: 28px; padding: 8px 0; }

  /* When nobody is here yet */
  .header-empty h1 {
    font-family: var(--serif); font-size: 32px; font-weight: 700;
    letter-spacing: .02em; color: var(--accent);
    text-shadow: 0 0 40px rgba(201,162,77,.15);
  }
  .header-empty .sub {
    font-family: var(--serif); font-size: 13px; font-weight: 400;
    color: var(--text-muted); letter-spacing: .25em; text-transform: uppercase;
    margin-top: 4px; font-style: italic;
  }

  /* When someone has arrived */
  .header-named .char-name {
    font-family: var(--serif); font-size: 36px; font-weight: 700;
    letter-spacing: .01em; color: var(--text);
    line-height: 1.2;
  }
  .header-named .char-title {
    font-family: var(--serif); font-size: 15px; font-weight: 400;
    color: var(--accent); font-style: italic;
    margin-top: 2px; letter-spacing: .04em;
  }
  .header-named .sub {
    font-family: var(--serif); font-size: 11px; font-weight: 400;
    color: var(--text-muted); letter-spacing: .2em; text-transform: uppercase;
    margin-top: 8px; font-style: italic;
    opacity: .6;
  }

  /* Cards — less glossy, more material */
  .card {
    background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
    transition: border-color var(--transition);
    margin-bottom: 16px;
    position: relative;
  }
  .card:hover { border-color: var(--border-hover); }

  /* The worn-and-wielded card — these are on your body */
  .card.worn {
    border-left: 2px solid rgba(201,162,77,.15);
  }

  /* Section Dividers — like chapter markers */
  .divider { display: flex; align-items: center; gap: 16px; margin: 32px 0 18px; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }
  .divider-label {
    font-family: var(--serif); font-size: 14px; font-weight: 600;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--text-muted); white-space: nowrap;
  }

  /* Toolbar — New Character is separated, because it's an ending */
  .toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar-gap { width: 16px; }
  .btn {
    cursor: pointer; border: 1px solid var(--border); background: rgba(237,232,223,.03);
    color: var(--text-dim); padding: 7px 16px; border-radius: var(--radius-sm);
    font-family: var(--font); font-size: 12px; font-weight: 500;
    transition: all var(--transition); white-space: nowrap; letter-spacing: .02em;
  }
  .btn:hover { background: rgba(237,232,223,.07); color: var(--text); border-color: var(--border-hover); }
  .btn.danger {
    border-color: rgba(196,114,114,.15); color: var(--text-muted);
  }
  .btn.danger:hover { background: var(--danger-dim); color: var(--danger); border-color: rgba(196,114,114,.3); }

  /* Form Fields */
  .field-grid { display: grid; gap: 14px; }
  .field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .field-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
  .field-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .field-grid.cols-2 { grid-template-columns: 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label {
    font-family: var(--serif); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted);
  }
  input[type="text"], select, input[type="number"], textarea {
    background: rgba(237,232,223,.04); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 13px;
    outline: none; transition: border-color var(--transition), box-shadow var(--transition); width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--border-accent); box-shadow: 0 0 0 2px var(--accent-dim);
  }
  select { cursor: pointer; }
  textarea { min-height: 100px; resize: vertical; line-height: 1.65; }

  /* ============================================================
     ABILITY SCORES — scores that have been shaped glow warmer
     ============================================================ */
  .ability-card {
    text-align: center; padding: 16px 8px;
    background: rgba(237,232,223,.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
    transition: all .3s ease;
    position: relative;
  }
  .ability-card:hover { border-color: var(--border-hover); background: rgba(237,232,223,.04); }
  /* When a score has been changed from default — the character is taking shape here */
  .ability-card.shaped {
    background: rgba(201,162,77,.04); border-color: rgba(201,162,77,.1);
  }
  .ability-name {
    font-family: var(--serif); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .ability-score {
    font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--text);
    width: 60px; text-align: center; background: transparent; border: none;
    border-bottom: 2px solid rgba(201,162,77,.2); outline: none;
    margin: 0 auto; display: block; transition: border-color var(--transition);
  }
  .ability-score:focus { border-bottom-color: var(--accent); box-shadow: none; }
  .ability-mod {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: var(--accent); margin-top: 8px; letter-spacing: .05em;
  }

  /* ============================================================
     VITAL STATISTICS — HP card tints with health state
     ============================================================ */
  .vital-card {
    text-align: center; padding: 16px 10px;
    background: rgba(237,232,223,.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
    transition: background .4s ease, border-color .4s ease;
  }
  .vital-card.hp-healthy { background: rgba(126,168,142,.04); border-color: rgba(126,168,142,.1); }
  .vital-card.hp-wounded { background: rgba(201,162,77,.05); border-color: rgba(201,162,77,.12); }
  .vital-card.hp-critical { background: rgba(196,114,114,.06); border-color: rgba(196,114,114,.15); }
  .vital-label {
    font-family: var(--serif); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: 10px;
  }
  .vital-value { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .vital-input {
    font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--text);
    width: 54px; text-align: center; background: transparent; border: none;
    border-bottom: 2px solid rgba(201,162,77,.2); outline: none;
  }
  .vital-input:focus { border-bottom-color: var(--accent); }
  .vital-sep { font-size: 18px; color: var(--text-muted); }
  .vital-static {
    font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--accent);
  }

  .hp-bar-track {
    width: 100%; height: 6px; background: rgba(237,232,223,.06);
    border-radius: 3px; margin-top: 10px; overflow: hidden;
  }
  .hp-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.4s ease, background 0.4s ease;
  }

  /* ============================================================
     CONDITIONS — active ones pulse slowly, because they're ongoing
     ============================================================ */
  .conditions-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .cond-tag {
    font-family: var(--serif); font-size: 12px; font-weight: 600;
    padding: 4px 14px; letter-spacing: .03em;
    border: 1px solid var(--border); background: rgba(237,232,223,.02);
    border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition);
    color: var(--text-dim);
  }
  .cond-tag:hover { background: rgba(237,232,223,.06); border-color: var(--border-hover); }
  .cond-tag.active {
    background: var(--danger-dim); border-color: rgba(196,114,114,.35);
    color: var(--danger); font-weight: 700;
    animation: condPulse 3.5s ease-in-out infinite;
  }
  @keyframes condPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .7; }
  }

  /* ============================================================
     DOMAINS — invested ones breathe, empty ones recede
     ============================================================ */
  .domains-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .domain-card.expanded { grid-column: 1 / -1; }
  .domain-card {
    padding: 14px 16px;
    background: rgba(237,232,223,.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
    transition: all .3s ease; position: relative; overflow: hidden;
  }
  /* Empty domains recede — they're possibilities, not commitments */
  .domain-card.empty {
    opacity: .5;
  }
  .domain-card.empty:hover {
    opacity: .75;
    background: rgba(237,232,223,.04); border-color: var(--border-hover);
  }
  /* Invested domains warm up */
  .domain-card.has-level {
    border-left: 3px solid var(--accent);
    opacity: 1;
    background: rgba(201,162,77,.03);
  }
  .domain-card.has-level:hover {
    background: rgba(201,162,77,.05); border-color: var(--border-hover);
  }
  /* Deep investment — level 10+ */
  .domain-card.deep {
    background: rgba(201,162,77,.05);
    border-left-color: var(--accent);
    box-shadow: inset 0 0 20px rgba(201,162,77,.04);
  }
  .domain-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .domain-icon {
    width: 34px; height: 34px; border-radius: var(--radius-sm); display: flex;
    align-items: center; justify-content: center;
    font-size: 17px; background: rgba(201,162,77,.06); border: 1px solid rgba(201,162,77,.1); flex-shrink: 0;
  }
  .domain-info { flex: 1; min-width: 0; }
  .domain-name {
    font-family: var(--serif); font-size: 13px; font-weight: 700;
    color: var(--text); letter-spacing: .01em;
  }
  .domain-meta { font-size: 10px; color: var(--text-muted); line-height: 1.4; margin-top: 1px; }
  .domain-level-wrap { display: flex; align-items: center; gap: 4px; }
  .domain-level-lbl {
    font-family: var(--serif); font-size: 9px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .domain-level-input {
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent);
    width: 38px; text-align: center; background: var(--accent-dim);
    border: 1px solid var(--border-accent);
    border-radius: var(--radius-sm); outline: none; padding: 3px 4px;
  }
  .domain-level-input:focus { box-shadow: 0 0 0 2px var(--accent-glow); }
  .domain-ib {
    font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--accent);
    background: var(--accent-dim); padding: 2px 10px; border-radius: var(--radius-sm);
    display: inline-block; margin-top: 4px; letter-spacing: .03em;
  }
  .domain-path { margin-top: 8px; }
  .domain-path select {
    font-family: var(--font); font-size: 11px; color: var(--text); width: 100%;
    background: rgba(237,232,223,.04); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: var(--radius-sm); cursor: pointer; outline: none;
  }
  .domain-path select:focus { border-color: var(--border-accent); box-shadow: 0 0 0 2px var(--accent-dim); }
  .domain-path-label {
    font-family: var(--serif); font-size: 9px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
  }
  .domain-path-hint { font-size: 10px; color: var(--text-muted); opacity: .5; margin-top: 4px; }

  .domain-opt-section { margin-top: 6px; }
  .domain-opt-label {
    font-family: var(--serif); font-size: 9px; font-weight: 700;
    color: var(--info); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px;
  }
  .domain-opt-section select {
    font-family: var(--font); font-size: 11px; color: var(--text); width: 100%;
    background: rgba(237,232,223,.04); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: var(--radius-sm); cursor: pointer; outline: none;
  }
  .domain-opt-section select:focus { border-color: var(--info); box-shadow: 0 0 0 2px var(--info-dim); }

  /* Resources */
  .resource-card {
    text-align: center; padding: 12px 8px;
    background: rgba(237,232,223,.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .resource-label {
    font-family: var(--serif); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .resource-input {
    font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--warn);
    width: 60px; text-align: center; background: transparent; border: none;
    border-bottom: 2px solid rgba(201,162,77,.15); outline: none;
  }
  .resource-input:focus { border-bottom-color: var(--warn); }

  /* Equipment & Inventory */
  .inv-list { list-style: none; }
  .inv-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .inv-item:last-child { border-bottom: none; }
  .inv-bullet { color: var(--accent); font-size: 7px; flex-shrink: 0; opacity: .6; }
  .inv-input {
    flex: 1; font-family: var(--font); font-size: 13px; color: var(--text);
    background: transparent; border: none; outline: none; padding: 2px 0;
  }
  .inv-input::placeholder { color: rgba(237,232,223,.15); }
  .inv-input:focus { color: var(--text); }
  .inv-remove {
    background: none; border: none; color: rgba(237,232,223,.12); cursor: pointer;
    font-size: 14px; padding: 2px 6px; transition: color var(--transition);
  }
  .inv-remove:hover { color: var(--danger); }
  .add-btn {
    font-family: var(--font); font-size: 11px; font-weight: 500;
    color: var(--text-muted); background: none; border: 1px dashed rgba(201,162,77,.15);
    border-radius: var(--radius-sm); padding: 7px 12px; cursor: pointer;
    transition: all var(--transition); margin-top: 10px; display: block; width: 100%;
    letter-spacing: .02em;
  }
  .add-btn:hover { border-color: var(--border-accent); color: var(--accent); background: var(--accent-dim); }

  .inv-section-title {
    font-family: var(--serif); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: 10px;
  }

  /* ============================================================
     BACKSTORY & NOTES — given more room, more warmth
     ============================================================ */
  .notes-area {
    width: 100%; min-height: 120px; font-family: var(--font); font-size: 13px;
    color: var(--text); background: rgba(237,232,223,.03); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px; outline: none; resize: vertical; line-height: 1.7;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .notes-area:focus { border-color: var(--border-accent); box-shadow: 0 0 0 2px var(--accent-dim); }
  .notes-area::placeholder { color: rgba(237,232,223,.18); font-style: italic; }

  /* Backstory gets its own treatment — this is where the person lives */
  .backstory-area {
    min-height: 140px;
    background: rgba(201,162,77,.02);
    border-color: rgba(201,162,77,.08);
  }
  .backstory-area:focus {
    border-color: var(--border-accent);
    background: rgba(201,162,77,.03);
  }

  /* Colophon */
  .colophon {
    text-align: center; margin-top: 48px; padding: 16px 0;
    border-top: 1px solid var(--border);
    font-family: var(--serif); font-size: 11px; font-style: italic;
    color: rgba(125,118,136,.35); letter-spacing: .04em;
    line-height: 1.7;
  }

  /* Responsive */
  @media (max-width: 860px) {
    .field-grid.cols-3 { grid-template-columns: 1fr; }
    .field-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
    .field-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .domains-grid { grid-template-columns: 1fr; }
    .field-grid.cols-2 { grid-template-columns: 1fr; }
    .toolbar-gap { width: 8px; }
  }
  @media (max-width: 480px) {
    .field-grid.cols-6 { grid-template-columns: repeat(2, 1fr); }
    .field-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .app-wrap { padding: 16px 12px 40px; }
    .header-named .char-name { font-size: 28px; }
    .header-empty h1 { font-size: 26px; }
  }

  #importInput { display: none; }

  @media print {
    body { background: #fff !important; color: #000 !important; }
    body::before, body::after { display: none; }
    .card { box-shadow: none !important; border-color: #ccc !important; background: #fff !important; }
    .toolbar { display: none !important; }
    .btn { display: none !important; }
    .colophon { display: none !important; }
    input, select, textarea { color: #000 !important; border-color: #ccc !important; }
    .ability-score, .vital-input, .resource-input { color: #000 !important; }
    .domain-level-input { color: #000 !important; background: #eee !important; }
    .cond-tag { color: #333 !important; border-color: #ccc !important; animation: none !important; }
    .cond-tag.active { color: #c00 !important; border-color: #c00 !important; background: #fdd !important; }
    .domain-card.empty { opacity: 1 !important; }
  }

  /* ============================================================
     DOMAIN MECHANICS — expandable detail panel
     ============================================================ */
  .domain-expand-btn {
    font-family: var(--serif); font-size: 10px; font-weight: 600;
    color: var(--text-muted); background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 3px 10px; cursor: pointer;
    transition: all var(--transition); margin-top: 8px; letter-spacing: .04em;
  }
  .domain-expand-btn:hover { color: var(--accent); border-color: var(--border-accent); background: var(--accent-dim); }
  .domain-expand-btn.open { color: var(--accent); border-color: var(--border-accent); }

  .domain-mechanics {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
    max-height: 500px; overflow-y: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px;
  }
  .domain-mechanics .mech-section { break-inside: avoid; }
  @media (max-width: 860px) {
    .domain-mechanics { grid-template-columns: 1fr; }
  }
  .domain-mechanics::-webkit-scrollbar { width: 3px; }
  .domain-mechanics::-webkit-scrollbar-thumb { background: rgba(201,162,77,.15); border-radius: 2px; }

  .mech-section { margin-bottom: 10px; }
  .mech-section:last-child { margin-bottom: 0; }
  .mech-section-title {

      },

        options7: [{ id: 'lifebond', name: 'Lifebond', desc: 'Share vitality.', mechanics: ['Life Transfer (bonus action): transfer up to IB × 2 HP between you and companion.', 'Companion regains +IB from any healing. Uses: IB per long rest.'] }, { id: 'evolve', name: 'Adaptive Evolution', desc: 'Companion adapts to threats.', mechanics: ['Reactive Adaptation (reaction): companion gains damage resistance for 1 min. Uses: IB per long rest.', 'Companion\'s natural weapons count as magical.', 'Teach minor adaptations (gills, thick hide, padded feet, keen senses). Max 2 at a time.'] }],
        options13: [{ id: 'fusion', name: 'Primal Fusion', desc: 'Merge consciousness with your beast.', mechanics: ['Fusion (action, 1 min, concentration): merge forms. Use companion\'s physical stats, your mental stats + all features.', 'Take your action + companion\'s multiattack each turn.', 'If fused form hits 0 HP: both appear at 0 HP, death saves separately. 1/long rest.'] }, { id: 'soulguard', name: 'Soul Guard', desc: 'Companion anchors your consciousness.', mechanics: ['While companion is conscious within 30 ft: immune to charmed, frightened, stunned.', 'On failed Wis/Cha save: companion can use reaction to re-save for you. Uses: IB per long rest.'] }]

const ABILITIES = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
const ABILITY_NAMES = { STR: 'Strength', DEX: 'Dexterity', CON: 'Constitution', INT: 'Intelligence', WIS: 'Wisdom', CHA: 'Charisma' };
const CONDITIONS = [
  'Blinded', 'Charmed', 'Deafened', 'Exhaustion', 'Frightened',
  'Grappled', 'Incapacitated', 'Invisible', 'Paralyzed', 'Petrified',
  'Poisoned', 'Prone', 'Restrained', 'Stunned', 'Unconscious'
];
const REGIONS = ['Verdant Wilds', 'Sunscorch Wastes', 'Ironspire Peaks', 'Gloomfen Marsh', 'Hearthstone Keep', 'Wanderer'];

function getIB(level) {
  if (level >= 17) return 6;
  if (level >= 13) return 5;
  if (level >= 9) return 4;
  if (level >= 5) return 3;
  return 2;
}
function getMod(score) {
  const s = parseInt(score) || 10;
  const m = Math.floor((s - 10) / 2);
  return m >= 0 ? '+' + m : '' + m;
}

let char = {
  name: '', title: '', race: '', background: '', homeland: 'Wanderer', level: 1,
  abilities: { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 },
  hp: { current: 10, max: 10 }, ac: 10, speed: 30, profBonus: 2,
  domains: {}, conditions: [],
  equipment: ['', '', '', '', '', ''],
  inventory: ['', '', '', '', '', '', '', ''],

};

// ============================================================
// EXPAND STATE — which domains have mechanics visible
// ============================================================
let expandedDomains = {};
let showGlossary = false;

function toggleDomainExpand(domainId) {
  expandedDomains[domainId] = !expandedDomains[domainId];
  render();
}

function renderDomainMechanics(domain, domState, selectedPath) {
  let html = '';
  const dlvl = domState.level;

  // Core nodes
  if (domain.core && domain.core.length) {
    html += '<div class="mech-section"><div class="mech-section-title">\u25C6 Core Progression</div>';
    for (const node of domain.core) {
      const unlocked = dlvl >= node.level;
      html += `<div class="mech-node ${unlocked ? '' : 'locked-node'}">`;
      html += `<span class="mech-node-level">L${node.level}</span>`;
      html += `<span class="mech-node-title">${esc(node.title)}</span>`;
      if (node.body) html += `<div class="mech-node-body">${esc(node.body)}</div>`;
      if (node.mechanics) {
        for (const m of node.mechanics) {
          html += `<div class="mech-bullet">${esc(m)}</div>`;
        }
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // Selected path
  if (selectedPath) {
    html += '<div class="mech-section"><div class="mech-section-title path-title">\u25C6 Path: ' + esc(selectedPath.name) + '</div>';
    if (selectedPath.mechanics) {
      html += '<div class="mech-path-block"><div class="mech-path-name">Passive Benefits</div>';
      for (const m of selectedPath.mechanics) {
        html += `<div class="mech-bullet">${esc(m)}</div>`;
      }
      html += '</div>';
    }
    // L7 option details
    if (domState.opt7 && selectedPath.options7) {
      const opt = selectedPath.options7.find(o => o.id === domState.opt7);
      if (opt) {
        html += `<div class="mech-path-block"><div class="mech-path-name">L7: ${esc(opt.name)}</div>`;
        if (opt.desc) html += `<div class="mech-node-body">${esc(opt.desc)}</div>`;
        if (opt.mechanics) {
          for (const m of opt.mechanics) {
            html += `<div class="mech-bullet">${esc(m)}</div>`;
          }
        }
        html += '</div>';
      }
    }
    // L13 option details
    if (domState.opt13 && selectedPath.options13) {
      const opt = selectedPath.options13.find(o => o.id === domState.opt13);
      if (opt) {
        html += `<div class="mech-path-block"><div class="mech-path-name">L13: ${esc(opt.name)}</div>`;
        if (opt.desc) html += `<div class="mech-node-body">${esc(opt.desc)}</div>`;
        if (opt.mechanics) {
          for (const m of opt.mechanics) {
            html += `<div class="mech-bullet">${esc(m)}</div>`;
          }
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }

  return html;
}

// ============================================================
// HELPERS
// ============================================================
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleCondition(c) {
  const i = char.conditions.indexOf(c);
  if (i >= 0) char.conditions.splice(i, 1);
  else char.conditions.push(c);
  render();
}

function exportCharacter() {
  const data = JSON.stringify(char, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (char.name || 'character').replace(/[^a-zA-Z0-9]/g, '_') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importCharacter(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k => { char[k] = data[k]; });
      DOMAINS.forEach(d => {
        if (!char.domains[d.id]) char.domains[d.id] = { level: 0, path: '', opt7: '', opt13: '' };
        // Migrate old format
        const dom = char.domains[d.id];
        if (dom.opt7 === undefined) dom.opt7 = '';
        if (dom.opt13 === undefined) dom.opt13 = '';
        // Migrate old path names to IDs
        if (dom.path && !d.paths.find(p => p.id === dom.path)) {
          const match = d.paths.find(p => p.name === dom.path);
          if (match) dom.path = match.id;
          else dom.path = '';
        }
      });
      render();
    } catch(err) {
      alert('Could not read character file. Make sure it is a valid .json file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetCharacter() {
  if (!confirm('This character will be gone. Start someone new?')) return;
  char = {
