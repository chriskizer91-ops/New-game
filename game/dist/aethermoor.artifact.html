/* src/ui/card.css */
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
body.ov-open {
  overflow: hidden;
}
.ov {
  position: fixed;
  inset: 0;
  z-index: 40;
  overflow-y: auto;
  overscroll-behavior: contain;
  background:
    radial-gradient(
      120% 70% at 50% 0%,
      rgba(40, 22, 12, .97),
      rgba(8, 6, 8, .98) 70%),
    rgba(8, 6, 8, .98);
  -webkit-overflow-scrolling: touch;
}
.ov-inner {
  max-width: 1060px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gutter) calc(28px + env(safe-area-inset-bottom, 0px));
}
.ov-card .ov-inner {
  max-width: 520px;
}
.reveal-wrap {
  display: grid;
  gap: 14px;
}
.reveal-left,
.reveal-right {
  min-width: 0;
}
@media (min-width: 900px) {
  .reveal-wrap.has-stage {
    grid-template-columns: minmax(0, 1fr) minmax(380px, 470px);
    align-items: start;
    gap: 22px;
  }
  .reveal-wrap.has-stage .reveal-left {
    position: sticky;
    top: 12px;
  }
}
.ov-foot {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 16px 5px 0;
}
.ov-foot .btn {
  min-width: 200px;
  min-height: 48px;
  font-size: 13px;
}
.btn.ghost {
  background: transparent;
}
.reveal-stage {
  position: relative;
  background: #07060a;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--seam);
  overflow: hidden;
  margin: 5px;
}
.reveal-stage canvas {
  margin: 0 auto;
}
.reveal-stage.shake {
  animation: shake .42s steps(2, end) 2;
}
@keyframes shake {
  0% {
    transform: translate(0, 0);
  }
  25% {
    transform: translate(-4px, 2px);
  }
  50% {
    transform: translate(3px, -3px);
  }
  75% {
    transform: translate(-2px, -1px);
  }
  100% {
    transform: translate(0, 0);
  }
}
.flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}
.flash.go {
  animation: flash .5s ease-out;
}
@keyframes flash {
  0% {
    opacity: .85;
  }
  100% {
    opacity: 0;
  }
}

  position: absolute;
  inset: 0 0 auto 0;
  padding: 10px 12px 0;
  text-align: center;

}

.card {
  --rc: var(--r-worn);
  --rc2: #4a4740;
  --rglow: rgba(172, 166, 153, 0);
  position: relative;
  max-width: 470px;
  margin: 10px auto 0;
  padding: 26px 16px 18px;
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--rc) 14%, var(--iron)) 0,
      var(--iron) 38%,
      var(--soot-2) 100%);
  border: 3px solid var(--rc);
  box-shadow:
    0 0 0 3px var(--ink),
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--rc2),
    0 0 40px var(--rglow);
}
.card[data-r=wrought] {
  --rc: var(--r-wrought);
  --rc2: #6e6a60;
}
.card[data-r=tempered] {
  --rc: var(--r-tempered);
  --rc2: #24521f;
}
.card[data-r=runed] {
  --rc: var(--r-runed);
  --rc2: #1d3f6e;
  --rglow: rgba(82, 153, 240, .18);
}
.card[data-r=storied] {
  --rc: var(--r-storied);
  --rc2: #4b2474;
  --rglow: rgba(183, 116, 244, .28);
}
.card[data-r=heirloom] {
  --rc: var(--r-heirloom);
  --rc2: #7a4a12;
  --rglow: rgba(244, 173, 63, .34);
}
.card[data-r=regalia] {
  --rc: var(--r-regalia);
  --rc2: #1a5a54;
  --rglow: rgba(79, 209, 192, .3);
}
.card[data-r=primal] {
  --rc: var(--r-primal);
  --rc2: #5a6a8a;
  --rglow: rgba(220, 232, 255, .36);
  border-color: transparent;
}
.card[data-r=primal]::before {
  content: "";
  position: absolute;
  inset: -3px;
  z-index: 0;
  pointer-events: none;
  padding: 3px;
  background:
    conic-gradient(
      from var(--ang),
      #fff6e0,
      #c8d8ff,
      #fff,
      #ffd7a0,
      #fff6e0);

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 18px 22px 16px;
  max-width: min(92vw, 440px);
  background:
    linear-gradient(
      180deg,
      #3a2412,
      var(--iron) 40%,
      var(--soot-2));
  border: 3px solid var(--r-heirloom);
  box-shadow:
    0 0 0 3px var(--ink),
    inset 0 0 0 3px var(--ink),
    0 0 60px rgba(244, 173, 63, .45);
  animation: slamIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
.ov-slam[data-r=storied] .slam-card {
  border-color: var(--r-storied);
  box-shadow:
    0 0 0 3px var(--ink),
    inset 0 0 0 3px var(--ink),
    0 0 60px rgba(183, 116, 244, .45);
}
.ov-slam[data-r=regalia] .slam-card {
  border-color: var(--r-regalia);
}
.slam-card canvas.portrait {
  box-shadow: 0 0 0 3px var(--ink);
}
@keyframes slamIn {
  0% {
    transform: scale(2.6) rotate(-14deg);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(-2deg);
  }
}
.slam-kick {
  margin: 8px 0 0;
  font-family: var(--f-pixel);
  font-size: 11px;
  letter-spacing: .3em;
  color: var(--hearth-hot);
  text-transform: uppercase;
}
.slam-name {
  margin: 0;
  font-family: var(--f-display);
  font-size: 40px;
  line-height: 1;
  text-align: center;
  text-shadow: 0 0 20px rgba(255, 203, 102, .5);
}
.slam-item {
  margin: 0;
  font-family: var(--f-pixel);
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--parchment-2);
  text-transform: uppercase;
}
.slam-text {
  margin: 4px 0 0;
  text-align: center;
  font-size: 15px;
  color: var(--parchment-2);
  max-width: 36ch;
}
.ov-slam.still,
.ov-slam.still * {
  animation: none !important;
}
@media (max-width: 420px) {
  .item-name {
    font-size: 32px;
  }
  .card {
    padding-inline: 12px;
  }
  .banner h2 {
    font-size: 22px;
  }
  .hero-view canvas {
    width: 128px;
    height: 128px;
    margin-top: -8px;
  }
  .slam-name {
    font-size: 32px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .card.enter,
  .card.flip {
    animation: cardIn .01s both;
  }
  .reveal-stage.shake,
  .flash.go,
  .stamp.slam {
    animation: none;
  }
  .card[data-r=primal]::before,
  .card[data-r=primal] .rar {
    animation: none;
  }
}

/* src/ui/battle.css */
.screen.screen-battle {
  max-width: none;
  padding: 0;
}
.bt {
  --spd: 1;
  --bt-red: #ee6c54;
  --bt-red-deep: #6e1d14;
  --bt-gold: #ffcb66;
  --bt-hp: #8ad872;
  --bt-hp-deep: #2d6a22;
  --bt-mp: #6fb4f0;
  --bt-mp-deep: #1d3f6e;
  --bt-surge: #f4ad3f;
  position: relative;
  margin: 0 auto;
  max-width: 1180px;
  height: 100vh;
  height: 100dvh;
  min-height: 560px;
  display: grid;
  overflow: hidden;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(170px, 1fr) auto auto auto;
  grid-template-areas: "top" "stage" "ribbon" "party" "dock";
  background: var(--soot);
  user-select: none;
  -webkit-user-select: none;
}
.bt button {
  -webkit-tap-highlight-color: transparent;
}
.bt-top {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px 6px 12px;
  background:
    linear-gradient(
      180deg,
      #1c1410,
      var(--soot-2));
  box-shadow: inset 0 -2px 0 var(--ink), inset 0 -3px 0 var(--seam);
  min-width: 0;
}
.bt-where {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.bt-where-k {
  font-family: var(--f-pixel);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--hearth);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bt-where-name {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 19px;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bt-tools {
  display: flex;
  gap: 6px;
  flex: none;
}
.bt-tool {
  min-height: 40px;
  min-width: 44px;
  padding: 0 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--f-pixel);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--parchment-2);
  background: var(--iron);
  border: 2px solid var(--seam);
  box-shadow: 0 0 0 2px var(--ink);
}
.bt-tool:hover {
  border-color: var(--seam-2);
  color: var(--parchment);
}
.bt-auto .dot {
  width: 8px;
  height: 8px;
  background: var(--seam-2);
  box-shadow: 0 0 0 1px var(--ink);
}
.bt-auto[aria-pressed=true] {
  color: var(--hearth-hot);
  border-color: var(--hearth-deep);
}
.bt-auto[aria-pressed=true] .dot {
  background: var(--hearth-hot);
  box-shadow: 0 0 0 1px var(--ink), 0 0 8px var(--hearth);
  animation: bt-blink calc(1.2s / var(--spd)) steps(2, start) infinite;
}
.bt-speed {
  min-width: 48px;
  color: var(--parchment);
}
.bt[data-speed="2"] .bt-speed {
  color: var(--hearth-hot);
  border-color: var(--hearth-deep);
}
.bt[data-speed="4"] .bt-speed {
  color: #231306;
  background:
    linear-gradient(
      180deg,
      #ffd27a,
      #f09a36);
  border-color: var(--ink);
}
.bt-tool[aria-expanded=true] {
  color: var(--hearth-hot);
  border-color: var(--hearth-deep);
}
.bt-stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  background: #07060a;
  box-shadow: inset 0 0 0 1px var(--ink);
  touch-action: manipulation;
  min-height: 0;
}
.bt-stage-cv {
  position: absolute;
  left: 0;
  top: 0;
}
.bt-overlay,
.bt-fx-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.bt-fx-layer {
  z-index: 6;
}
.bt-stage.shake-1 {
  animation: bt-shake calc(.3s / var(--spd)) steps(2, end) 1;
}
.bt-stage.shake-2 {
  animation: bt-shake calc(.42s / var(--spd)) steps(2, end) 2;
}
.bt-stage.shake-3 {
  animation: bt-shake-big calc(.5s / var(--spd)) steps(2, end) 2;
}
@keyframes bt-shake {
  0% {
    transform: translate(0, 0);
  }
  25% {
    transform: translate(-4px, 2px);
  }
  50% {
    transform: translate(3px, -3px);
  }
  75% {
    transform: translate(-2px, -1px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes bt-shake-big {
  0% {
    transform: translate(0, 0);
  }
  20% {
    transform: translate(-8px, 4px);
  }
  40% {
    transform: translate(7px, -5px);
  }
  60% {
    transform: translate(-5px, -2px);
  }
  80% {
    transform: translate(4px, 3px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes bt-blink {
  50% {
    opacity: .3;
  }
}
.bt-foe {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.bt-foe[hidden] {
  display: none;
}
.bt-foe-hit {
  position: absolute;
  pointer-events: auto;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  z-index: 1;
}
.bt-foe-hit:focus-visible {
  outline: 2px dashed var(--hearth-hot);
  outline-offset: -2px;
}
.bt-foe.down .bt-plate {
  opacity: 0;
  transition: opacity calc(.5s / var(--spd));
}
.bt-foe.down .bt-intent,
.bt-foe.down .bt-foe-hit {
  display: none;
}
.bt-plate {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 3px 5px 4px;
  background: rgba(13, 10, 14, .94);
  box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--seam);
}
.bt-foe.active .bt-plate {
  box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--bt-red);
}
.bt-foe.valid .bt-plate {
  box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--hearth);
}
.bt-foe.focus .bt-plate {
  box-shadow: 0 0 0 2px var(--hearth-hot), 0 0 14px rgba(238, 142, 49, .45);
}
.bt-foe.dim .bt-plate {
  opacity: .55;
}
.bt-foe[data-tier=champion] .bt-foe-name {
  color: #d8b8ff;
}
.bt-foe[data-tier=relic-bearer] .bt-foe-name {
  color: var(--r-heirloom);
}
.bt-foe[data-tier=veteran] .bt-foe-name {
  color: #f0d8b0;
}
.bt-plate-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}
.bt-foe-name {
  font-family: var(--f-pixel);
  font-size: 10px;
  letter-spacing: .04em;
  color: var(--parchment);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.bt-foe-lv {
  font-family: var(--f-pixel);
  font-size: 9px;
  color: var(--ash);
  flex: none;
}
.bt-plate-bar {
  display: flex;
  align-items: center;
  gap: 4px;
}
.bt-foe-hpnum {
  font-family: var(--f-pixel);
  font-size: 9px;
  color: var(--parchment-2);
  min-width: 2.2em;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.bt-foe-st {
  display: flex;
  gap: 2px;
  align-items: center;
  height: 24px;
  overflow: hidden;
}
.bt-foe-st[hidden],
.bt-grips[hidden] {
  display: none;
}
.bt-st-more {
  font-family: var(--f-pixel);
  font-size: 10px;
  color: var(--parchment-2);
  padding: 0 2px;
}
.bt-grips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 1px;
}
.bt-bar {
  --pct: 100%;
  position: relative;
  display: block;
  flex: 1;
  height: 6px;
  background: #1a0f0c;
  box-shadow: 0 0 0 1px var(--ink);
  overflow: hidden;
}
.bt-bar i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--pct);
}
.bt-bar .fill {
  transition: width calc(.38s / var(--spd)) ease-out;
}
.bt-bar .lag {
  background: #f4e4c0;
  transition: width calc(.5s / var(--spd)) ease-in calc(.35s / var(--spd));
}
.bt-bar.hp .fill {
  background:
    linear-gradient(
      180deg,
      #b6f098 0,
      var(--bt-hp) 45%,
      var(--bt-hp-deep) 100%);
}
.bt-bar.hp.low .fill {
  background:
    linear-gradient(
      180deg,
      #ffd27a 0,
      #f09a36 50%,
      #8a4a12 100%);
}
.bt-bar.hp.foe .fill {
  background:
    linear-gradient(
      180deg,
      #ff9c86 0,
      var(--bt-red) 45%,
      var(--bt-red-deep) 100%);
}
.bt-bar.hp.foe.low .fill {
  background:
    linear-gradient(
      180deg,
      #ff9c86 0,
      #d23b3b 50%,
      #4a0e0a 100%);
}
.bt-bar.mp {
  height: 4px;
  background: #0c1320;
}
.bt-bar.mp .fill {
  background:
    linear-gradient(
      180deg,
      #b6dcff 0,
      var(--bt-mp) 50%,
      var(--bt-mp-deep) 100%);
}
.bt-bar.grip {
  width: 34px;
  flex: none;
  height: 5px;
  background: #16141c;
}
.bt-bar.grip .fill {
  background:
    linear-gradient(
      180deg,
      #e6eef8 0,
      #9aa8bc 50%,
      #4a5468 100%);
  transition: width calc(.45s / var(--spd)) ease-out;
}
.bt-st {
  position: relative;
  display: inline-flex;
  line-height: 0;
}
.bt-st b {
  position: absolute;
  right: -2px;
  bottom: -3px;
  font-family: var(--f-pixel);
  font-size: 8px;
  line-height: 1;
  color: var(--parchment);
  text-shadow:
    0 1px 0 var(--ink),
    1px 0 0 var(--ink),
    -1px 0 0 var(--ink),
    0 -1px 0 var(--ink);
}
.bt-st.pop {
  animation: bt-pop calc(.35s / var(--spd)) cubic-bezier(.3, 1.6, .5, 1) both;
}
.bt-st.tick {
  animation: bt-tick calc(.4s / var(--spd)) steps(2, end) 2;
}
@keyframes bt-pop {
  from {
    transform: scale(2.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes bt-tick {
  50% {
    filter: brightness(2.2);
    transform: translateY(-2px);
  }
}
.bt-grip {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 18px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 4px;
  cursor: pointer;
  background: #14111a;
  border: 1px solid #3a3a4a;
  color: var(--parchment);
}
.bt-grip-nm {
  font-family: var(--f-pixel);
  font-size: 9px;
  color: #c9d4e2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.bt-grip .bt-bar.grip {
  flex: 1;
  min-width: 18px;
  width: auto;
}
.bt-grip-num {
  font-family: var(--f-pixel);
  font-size: 9px;
  color: #9aa8bc;
  flex: none;
}
.bt-grip::before {
  content: "";
  position: absolute;
  inset: -12px -6px;
}
.bt-grip:hover {
  border-color: #b4c3d2;
}
.bt-grip.loose {
  opacity: .55;
}
.bt-grip.loose .bt-bar {
  display: none;
}
.bt-grip.loose .bt-grip-num {
  color: var(--r-heirloom);
}
.bt-grip.hit {
  animation: bt-gripshake calc(.36s / var(--spd)) steps(2, end) 1;
  border-color: #fff4c0;
}
@keyframes bt-gripshake {
  25% {
    transform: translateX(-2px);
  }
  75% {
    transform: translateX(2px);
  }
}
.bt-grip::after {
  content: "";
  position: absolute;
  right: -3px;
  top: -3px;
  width: 3px;
  height: 3px;
  background: #fffbe8;
  opacity: 0;
  animation: bt-glint 2.4s steps(1, end) infinite;
}
.bt-grip.loose::after {
  display: none;
}
@keyframes bt-glint {
  0%, 90% {
    opacity: 0;
  }
  92%, 96% {
    opacity: 1;
  }
}
.bt-intent {
  position: absolute;
  transform: translate(-50%, -100%);
  z-index: 3;
  pointer-events: none;
  width: max-content;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 5px;
  align-items: center;
  padding: 2px 7px 3px 3px;
  background: rgba(11, 9, 16, .9);
  box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 1px var(--seam-2);
  white-space: nowrap;
}
.bt-intent::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  margin-left: -4px;
  border: 4px solid transparent;
  border-top-color: var(--seam-2);
  border-bottom: 0;
}
.bt-intent[hidden] {
  display: none;
}
.bt-die {
  grid-row: 1 / span 2;
  line-height: 0;
}
.bt-int-txt {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.15;
}
.bt-int-name {
  font-family: var(--f-pixel);
  font-size: 10px;
  letter-spacing: .03em;
  color: var(--hearth-hot);
  overflow: hidden;
  text-overflow: ellipsis;
}
.bt-int-tgt {
  font-size: 12px;
  color: var(--parchment-2);
  overflow: hidden;
  text-overflow: ellipsis;
}
.bt-int-tgt:empty {
  display: none;
}
.bt-int-charge {
  grid-column: 1 / span 2;
  justify-self: center;
  margin-top: 1px;
  padding: 1px 5px;
  font-family: var(--f-pixel);
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fff0e8;
  background: var(--bt-red-deep);
  box-shadow: 0 0 0 1px var(--bt-red);
  animation: bt-blink calc(.9s / var(--spd)) steps(2, start) infinite;
}
.bt-int-charge[hidden] {
  display: none;
}
.bt-intent.charging {
  box-shadow:
    0 0 0 1px var(--ink),
    inset 0 0 0 1px var(--bt-red),
    0 0 12px rgba(238, 108, 84, .4);
}
.bt-intent.cancelled .bt-int-name {
  text-decoration: line-through;
  color: var(--ash);
}
.bt-int-queue {
  grid-column: 1 / span 2;
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 2px;
  padding-top: 2px;
  border-top: 1px dashed var(--seam);
}
.bt-int-queue[hidden] {
  display: none;
}
.bt-q {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--f-pixel);
  font-size: 9px;
  color: var(--marsh);
}
.bt-intent.rolling .bt-die {
  animation: bt-jitter calc(.14s / var(--spd)) steps(2, end) infinite;
}
.bt-intent.settle {
  animation: bt-settle calc(.3s / var(--spd)) cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes bt-jitter {
  0% {
    transform: translate(-1px, 1px) rotate(-8deg);
  }
  100% {
    transform: translate(1px, -1px) rotate(8deg);
  }
}
@keyframes bt-settle {
  from {
    transform: translate(-50%, -100%) scale(1.25);
  }
  to {
    transform: translate(-50%, -100%) scale(1);
  }
}
.bt-move-ban {
  position: absolute;
  left: 50%;
  top: 8px;
  z-index: 7;
  transform: translateX(-50%);
  pointer-events: none;
  max-width: calc(100% - 24px);
  text-align: center;
  padding: 5px 16px 6px;
  background:
    linear-gradient(
      90deg,
      rgba(11, 9, 16, 0),
      rgba(11, 9, 16, .92) 18%,
      rgba(11, 9, 16, .92) 82%,
      rgba(11, 9, 16, 0));
}
.bt-move-ban b {
  display: block;
  font-family: var(--f-pixel);
  font-weight: 400;
  font-size: 14px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--hearth-hot);
  text-shadow: 0 2px 0 var(--ink);
}
.bt-move-ban small {
  display: block;
  font-size: 13px;
  line-height: 1.25;
  color: var(--parchment-2);
  white-space: normal;
  max-width: 36ch;
  margin: 1px auto 0;
}
.bt-move-ban[data-side=foe] b {
  color: #ffb4a4;
}
.bt-move-ban.in {
  animation: bt-banin calc(.28s / var(--spd)) ease-out both;
}
@keyframes bt-banin {
  from {
    opacity: 0;
    transform: translate(-50%, -8px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}
.bt-big-ban {
  position: absolute;
  left: 0;
  right: 0;
  top: 38%;
  z-index: 8;
  transform: translateY(-50%);
  pointer-events: none;
  text-align: center;
  padding: 12px 16px;
  background:
    linear-gradient(
      90deg,
      rgba(11, 9, 16, .5),
      rgba(11, 9, 16, .96) 18%,
      rgba(11, 9, 16, .96) 82%,
      rgba(11, 9, 16, .5));
}
.bt-big-ban b {
  display: block;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.05;
  color: var(--parchment);
  text-shadow: 0 2px 0 var(--ink), 0 0 18px rgba(255, 203, 102, .45);
  text-wrap: balance;
}
.bt-big-ban small {
  display: block;
  margin-top: 4px;
  font-family: var(--f-pixel);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;

    function duck(amount, secs) {
      if (!musicBus) return;
      const t = AC.currentTime, base = 0.5;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(musicBus.gain.value, t);
      musicBus.gain.linearRampToValueAtTime(base * amount, t + 0.08);
      musicBus.gain.linearRampToValueAtTime(base, t + secs);
    }
    function musicVoice(p, freqs, t, dur, out) {
      const g = p.g;
      for (const f of freqs) {
        switch (p.v) {
          case "bell":
            bell(f, t, Math.max(0.6, dur * 1.4), g, 3200, out);
            break;
          case "tri":
            tone(f, t, dur * 0.95, { type: "triangle", g, a: 0.01, sus: 0.8 }, out);
            break;
          case "pulse":
            tone(f, t, dur * 0.92, { type: "pulse", g, a: 6e-3, sus: 0.7, lp: p.lp || 2400 }, out);
            break;
          case "square":
            tone(f, t, dur * 0.8, { type: "square", g, a: 4e-3, sus: 0.5, lp: p.lp || 1800 }, out);
            break;
          case "pluck":
            tone(f, t, 0.16, { type: "triangle", g, a: 3e-3 }, out);
            break;
          case "flute":
            tone(f, t, dur * 0.95, { type: "sine", g, a: 0.06, sus: 0.85, vib: 5 }, out);
            break;
          case "pad":
            tone(f, t, dur, { type: "sawtooth", g, a: 0.02, sus: 0.6, lp: 900 }, out);
            tone(f, t, dur, { type: "sawtooth", g: g * 0.7, a: 0.02, sus: 0.6, lp: 900, det: 9 }, out);
            break;
        }
      }
    }
    function drum(kind, t, g, out) {
      if (kind === "k") {
        tone(130, t, 0.16, { to: 45, g: g * 0.35, type: "sine", a: 2e-3 }, out);
      } else if (kind === "s") noise(t, 0.12, { type: "bandpass", f: 1800, q: 0.9, g: g * 0.3, a: 2e-3 }, out);
      else if (kind === "h") noise(t, 0.04, { type: "highpass", f: 7e3, g: g * 0.12, a: 1e-3 }, out);
      else if (kind === "c") {
        noise(t + Math.random() * 0.08, 0.025, { type: "bandpass", f: 2e3 + Math.random() * 1800, q: 3, g: g * 0.25, a: 1e-3 }, out);
      }
    }
    function startTrack(name) {
      const T3 = PARSED[name];
      if (!T3 || !ctx()) return;
      const bus = AC.createGain();
      bus.connect(musicBus);
      const t0 = AC.currentTime + 0.06, fade = playing ? 0.9 : 0.35;
      bus.gain.setValueAtTime(0, AC.currentTime);
      bus.gain.linearRampToValueAtTime(T3.gain, t0 + fade);
      const stepDur = 60 / T3.bpm / T3.sub;
      const st = { name, bus, step: 0, next: t0, timer: 0, done: false };
      const tick = () => {
        if (!AC || st.done) return;
        while (st.next < AC.currentTime + 0.15) {
          if (!T3.loop && st.step >= T3.len) {
            st.done = true;
            clearInterval(st.timer);
            if (wanted === name) wanted = null;
            setTimeout(() => {
              try {
                bus.disconnect();
              } catch {
              }
              if (playing === st) playing = null;
            }, 3e3);
            return;
          }
          for (const p of T3.parts) {
            if (!T3.loop && st.step >= p.len) continue;
            const e = p.ev[st.step % p.len];
            if (!e) continue;
            if (e.drum) drum(e.drum, st.next, p.g, bus);
            else musicVoice(p, e.notes, st.next, e.dur * stepDur, bus);
          }
          st.next += stepDur;
          st.step++;
        }
      };
      st.timer = setInterval(tick, 30);
      tick();
      if (playing) stopTrack(playing, 0.9);
      playing = st;
    }
    function stopTrack(st, fade = 0.6) {
      if (!st || st.done) return;
      st.done = true;
      clearInterval(st.timer);
      if (AC) {
        const t = AC.currentTime;
        st.bus.gain.cancelScheduledValues(t);
        st.bus.gain.setValueAtTime(st.bus.gain.value, t);
        st.bus.gain.linearRampToValueAtTime(0, t + fade);
      }
      setTimeout(() => {
        try {
          st.bus.disconnect();
        } catch {
        }
      }, (fade + 0.3) * 1e3);
      if (playing === st) playing = null;
    }
    function sync() {
      if (!unlocked) return;
      const want = musicOn ? wanted : null;
      if (!want) {
        if (playing) stopTrack(playing);
        return;
      }
      if (playing && playing.name === want) return;
      startTrack(want);
    }
    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", () => {
        if (!AC) return;
        if (document.hidden) AC.suspend().catch(() => {
        });
        else AC.resume().catch(() => {
        });
      });
    }
    return {
      unlock() {
        if (unlocked) {
          ctx();
          return;
        }
        unlocked = true;
        if (ctx()) sync();
      },
      setEnabled(on) {
        enabled = !!on;
      },
      get enabled() {
        return enabled;
      },
      setMusicEnabled(on) {
        musicOn = !!on;
        sync();
      },
      get musicEnabled() {
        return musicOn;
      },
      get unlocked() {
        return unlocked;
      },
      get track() {
        return wanted;
      },
      sfx(name, opts = {}) {
        if (!enabled || !unlocked || !SFX[name] || !ctx()) return;
        try {
          SFX[name](AC.currentTime + 5e-3, opts);
        } catch (err) {
          console.warn("[audio]", name, err);
        }
      },
      music(track) {
        wanted = track && PARSED[track] ? track : null;
        if (track === "victory" && playing && playing.name === "victory") {
          stopTrack(playing, 0.1);
        }
        sync();
      },
      duck(amount = 0.4, secs = 1.5) {
        if (AC && unlocked) duck(amount, secs);
      }
    };
  }

  // src/ui/app.js
  var DEFAULT_SETTINGS = { sound: true, music: true, battleSpeed: 1, reducedMotion: false };
  function createApp(root, screens2) {
    const input = createInput();
    const audio = createAudio();
    const motionMQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
    let game = loadGame();
    let settings = loadSettings(DEFAULT_SETTINGS);
    audio.setEnabled(settings.sound);
    let current2 = null, currentName = null;
    const toastEl = document.createElement("div");
    toastEl.className = "toast";
    toastEl.setAttribute("role", "status");
    toastEl.hidden = true;
    let toastTimer = 0;
    const ctx = {
      get game() {
        return game;
      },
      setGame(g) {
        game = g;
        if (g) saveGame(g);
      },
      get settings() {
        return settings;
      },
      setSettings(patch) {
        settings = { ...settings, ...patch };
        saveSettings(settings);
        audio.setEnabled(settings.sound);
      },
      audio,
      input,
      services: {},
      reduced: () => settings.reducedMotion || !!(motionMQ && motionMQ.matches),
      toast(text, ms = 2200) {
        toastEl.textContent = text;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.hidden = true;
        }, ms);
      },
      go(name, params = {}) {
        const screen = screens2[name];
        if (!screen) throw new Error(`Unknown screen ${name}`);
        if (current2 && current2.unmount) current2.unmount();
        if (current2 && current2.off) current2.off();
        root.replaceChildren();
        root.dataset.screen = name;
        root.appendChild(toastEl);
        const host = document.createElement("main");
        host.className = `screen screen-${name}`;
        root.prepend(host);
        currentName = name;
        current2 = screen.mount(host, ctx, params) || {};
        if (current2.onAction) current2.off = input.onAction(current2.onAction);
        window.scrollTo(0, 0);
      },
      get screen() {
        return currentName;
      }
    };
    const unlock = () => {
      audio.unlock();
      window.removeEventListener("pointerdown", unlock);
      window.removeEventListener("keydown", unlock);
    };
    window.addEventListener("pointerdown", unlock);
    window.addEventListener("keydown", unlock);
    return ctx;
  }
